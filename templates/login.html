<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - SAMVAAD</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body class="auth-body">
    <div class="login-container">
        <div class="logo-section">
            <div class="brand-name">SAMVAAD</div>
            <div class="brand-subtitle">Admin Terminal</div>
        </div>

        {% if error %}
        <div class="error-message skeuo-recessed" style="color: #000; padding: 15px; border-radius: 8px; font-size: 13px; margin-bottom: 24px; display: flex; align-items: center; gap: 10px; border-left: 4px solid #000;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" />
            </svg>
            <strong style="font-weight: 800;">SYSTEM ERROR:</strong> {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label class="form-label">System Username</label>
                <input type="text" name="username" class="form-input" placeholder="Enter credentials" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label">Security Passkey</label>
                <input type="password" name="password" class="form-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-btn">
                Authenticate Access
            </button>
        </form>

        <div class="divider">
            <span>NETWORK</span>
        </div>

        <div style="text-align: center;">
            <a href="/verify_blockchain" class="verify-link">Public Registry Access</a>
        </div>

        <div class="skeuo-recessed" style="margin-top: 32px; padding: 20px; border-radius: 12px;">
            <p style="font-size: 11px; color: var(--text-dim); line-height: 1.6; margin: 0; text-transform: uppercase; letter-spacing: 0.5px;">
                <strong style="color: #000; display: block; margin-bottom: 6px; letter-spacing: 1px;">🔒 Restricted Area</strong>
                This workstation is for authorized personnel only. All interactions are recorded on the immutable ledger.
            </p>
        </div>
    </div>
</body>

</html>
